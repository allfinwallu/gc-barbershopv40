<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC Barbershop v41</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2 mb-8">
            <h1 class="text-4xl font-bold text-white tracking-wider">GC BARBERSHOP</h1>
            <p class="text-yellow-500 font-semibold tracking-widest">REKAP GC BANG ALL - V41</p>
            <p class="text-gray-400 text-sm mt-2">Update: Sistem Gaji Pokok & Notif Suara Transaksi</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 border-b border-gray-700 pb-2">
            <button onclick="showTab('kasir', this)" class="tab-btn px-4 py-2 bg-yellow-600 rounded-t-md font-bold text-black transition">Area Kasir</button>
            <button onclick="showTab('pengaturan', this)" class="tab-btn px-4 py-2 glass rounded-t-md font-bold text-gray-300 hover:text-white transition">Kelola Gaji</button>
        </div>

        <!-- Tab Kasir -->
        <div id="tab-kasir" class="glass p-6 rounded-b-xl rounded-tr-xl space-y-6">
            <div class="flex justify-between items-center border-b border-gray-700 pb-4">
                <h2 class="text-2xl font-bold text-white">Menu Layanan</h2>
                <div class="text-sm px-3 py-1 bg-green-900/50 text-green-400 rounded-full border border-green-800">
                    🟢 Supabase Terhubung
                </div>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Tombol Transaksi -->
                <button onclick="catatTransaksi('Fastcut', 35000)" class="p-6 bg-gray-800 rounded-xl hover:bg-gray-700 border border-gray-600 flex flex-col items-center justify-center space-y-2 transition transform active:scale-95 shadow-lg">
                    <span class="text-xl font-bold text-white">Fastcut</span>
                    <span class="text-yellow-500 font-semibold">Rp 35.000</span>
                </button>
                <button onclick="catatTransaksi('Haircut + Wash', 45000)" class="p-6 bg-gray-800 rounded-xl hover:bg-gray-700 border border-gray-600 flex flex-col items-center justify-center space-y-2 transition transform active:scale-95 shadow-lg">
                    <span class="text-xl font-bold text-white">Cut + Wash</span>
                    <span class="text-yellow-500 font-semibold">Rp 45.000</span>
                </button>
                <button onclick="catatTransaksi('Coloring', 150000)" class="p-6 bg-gray-800 rounded-xl hover:bg-gray-700 border border-gray-600 flex flex-col items-center justify-center space-y-2 transition transform active:scale-95 shadow-lg">
                    <span class="text-xl font-bold text-white">Coloring</span>
                    <span class="text-yellow-500 font-semibold">Rp 150.000</span>
                </button>
            </div>
        </div>

        <!-- Tab Pengaturan Gaji -->
        <div id="tab-pengaturan" class="glass p-6 rounded-b-xl rounded-tr-xl space-y-6 hidden">
            <div class="border-b border-gray-700 pb-4">
                <h2 class="text-2xl font-bold text-white">Skema Gaji Kapster</h2>
                <p class="text-gray-400 text-sm mt-1">Atur kombinasi Gaji Pokok bulanan/harian dan persentase Bagi Hasil.</p>
            </div>

            <div class="space-y-4">
                <!-- Kapster 1 -->
                <div class="bg-gray-800/80 p-5 rounded-xl border border-gray-600 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-md">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-yellow-600 rounded-full flex items-center justify-center text-black font-bold text-xl">M</div>
                        <div>
                            <div class="font-bold text-lg text-white">Molan</div>
                            <div class="text-xs text-green-400">Status: Aktif</div>
                        </div>
                    </div>
                    
                    <div class="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-4 w-full md:w-auto">
                        <div class="flex-1 md:w-40">
                            <label class="block text-xs text-gray-400 mb-1 font-semibold">Gaji Pokok (Rp)</label>
                            <input type="number" value="1500000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-500" />
                        </div>
                        <div class="flex-1 md:w-32">
                            <label class="block text-xs text-gray-400 mb-1 font-semibold">Bagi Hasil (%)</label>
                            <input type="number" value="40" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-500" />
                        </div>
                    </div>
                    <button onclick="simpanGaji('Molan')" class="px-6 py-2.5 bg-yellow-600 rounded-lg text-black font-bold hover:bg-yellow-500 transition shadow-lg w-full md:w-auto mt-2 md:mt-0">Simpan</button>
                </div>

                <!-- Kapster 2 -->
                <div class="bg-gray-800/80 p-5 rounded-xl border border-gray-600 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-md">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-yellow-600 rounded-full flex items-center justify-center text-black font-bold text-xl">A</div>
                        <div>
                            <div class="font-bold text-lg text-white">Agus</div>
                            <div class="text-xs text-green-400">Status: Aktif</div>
                        </div>
                    </div>
                    
                    <div class="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-4 w-full md:w-auto">
                        <div class="flex-1 md:w-40">
                            <label class="block text-xs text-gray-400 mb-1 font-semibold">Gaji Pokok (Rp)</label>
                            <input type="number" value="0" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-500" />
                        </div>
                        <div class="flex-1 md:w-32">
                            <label class="block text-xs text-gray-400 mb-1 font-semibold">Bagi Hasil (%)</label>
                            <input type="number" value="50" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-500" />
                        </div>
                    </div>
                    <button onclick="simpanGaji('Agus')" class="px-6 py-2.5 bg-yellow-600 rounded-lg text-black font-bold hover:bg-yellow-500 transition shadow-lg w-full md:w-auto mt-2 md:mt-0">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Effect (Suara Kasir ala GoPay) -->
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>

    <script>
        function showTab(tabName, btnElement) {
            if (tabName === 'kasir') {
                document.getElementById('tab-kasir').classList.remove('hidden');
                document.getElementById('tab-pengaturan').classList.add('hidden');
            } else {
                document.getElementById('tab-kasir').classList.add('hidden');
                document.getElementById('tab-pengaturan').classList.remove('hidden');
            }

            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.classList.remove('bg-yellow-600', 'text-black');
                tab.classList.add('glass', 'text-gray-300');
            });
            btnElement.classList.remove('glass', 'text-gray-300');
            btnElement.classList.add('bg-yellow-600', 'text-black');
        }

        function catatTransaksi(namaLayanan, harga) {
            const sound = document.getElementById('notifSound');
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Interaksi user diperlukan untuk audio."));

            Swal.fire({
                title: '<span class="text-green-400">Transaksi Berhasil!</span>',
                html: `<div class="font-bold text-xl mt-2 text-white">${namaLayanan}</div><div class="text-yellow-500 text-2xl font-bold mt-1">Rp ${harga.toLocaleString('id-ID')}</div>`,
                icon: 'success',
                toast: true,
                position: 'top',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                background: '#1f2937',
                color: '#fff',
                iconColor: '#4ade80',
                customClass: {
                    popup: 'border border-gray-600 shadow-2xl rounded-xl'
                }
            });
        }

        function simpanGaji(nama) {
            Swal.fire({
                title: 'Data Tersimpan!',
                text: `Pengaturan gaji pokok & bagi hasil untuk ${nama} telah diperbarui ke database.`,
                icon: 'success',
                background: '#1f2937',
                color: '#fff',
                confirmButtonColor: '#ca8a04',
                customClass: {
                    popup: 'border border-gray-600 rounded-xl'
                }
            });
        }
    </script>
</body>
</html>
